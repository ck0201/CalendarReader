name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test (.NET 9 & Frontend)
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Restore .NET dependencies
      run: dotnet restore CalendarReader.sln

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Frontend lint
      working-directory: frontend
      run: npm run lint

    - name: Frontend TypeScript validation
      working-directory: frontend
      run: npx tsc -b --noEmit

    - name: Frontend unit tests
      working-directory: frontend
      run: npm test

    - name: Build frontend production bundle
      working-directory: frontend
      run: npm run build

    - name: Build .NET solution
      run: dotnet build CalendarReader.sln --no-restore --configuration Release

    - name: Run .NET unit tests
      run: dotnet test CalendarReader.sln --no-build --configuration Release --verbosity normal
